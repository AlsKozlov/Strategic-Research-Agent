[project]
name = "bitgn-pac1-py"
version = "0.1.0"
description = "BitGN PAC1 agent (Yandex Cloud Foundation Models, locally-generated proto SDK)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Runtime: connectrpc client + protobuf, both public on PyPI
    "connectrpc>=0.10.0",
    "protobuf>=5.29.0",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    # protoc binary + python plugin live inside grpcio-tools; we only use codegen
    "grpcio-tools>=1.71.0",
    "protoc-gen-connect-python>=0.9.0",
]

[tool.uv]
package = false
