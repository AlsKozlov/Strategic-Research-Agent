[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-research-agent"
version = "0.1.0"
description = "Strategic Research Agent with A2A and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openai>=1.0",
  "duckduckgo-search>=6.0",
  "mcp>=1.0",
  "langgraph>=0.2.40",
  "langchain-core>=0.3.0",
  "tavily-python>=0.5.0",
  "trafilatura>=1.8.0",
]

[project.scripts]
strategic-research-a2a = "strategic_research_agent.interfaces.cli:run_a2a"
strategic-research-mcp = "strategic_research_agent.interfaces.cli:run_mcp"

[tool.setuptools.packages.find]
where = ["agent"]

[tool.setuptools.package-dir]
"" = "agent"
